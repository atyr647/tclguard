name: acceptbench

# Where does a connection flood's cost go? Bare Tcl accept-and-close, a guard-like "state then drop", the same on the runtime
# without the socket patch, and what Python (no Tcl) manages on the same machine. Flood: tests/load/tgload connflood.
# One fresh runner per variant: a run leaves tens of thousands of sockets in TIME_WAIT and uses up the ephemeral ports, which
# distorts whatever runs next on the same machine (the first version of this workflow ran them in a row and was confounded).
on:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        variant: [new-timed, unpatched-timed, new-bare, unpatched-bare, python]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Build the flood generator
        run: cd tests/load/tgload; go build -o ../tgload-bin.exe .
      - name: ${{ matrix.variant }}
        shell: pwsh
        run: |
          git show dd2bcf5:releases/tclguard-windows-x86_64-console.exe > old.exe       # runtime WITHOUT the socket patch
          git show 42edc10:releases/tclguard-windows-x86_64-console.exe > prev.exe      # the first shipped patch version (reads and writes only)
          $new = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path   # whatever this commit ships
          $old = (Resolve-Path .\old.exe).Path
          $prev = (Resolve-Path .\prev.exe).Path
          $gen = (Resolve-Path .\tests\load\tgload-bin.exe).Path
          $v = '${{ matrix.variant }}'
          $env:ACCEPT_PORT = "18080"
          if ($v -eq 'backlog') {
            $b = Start-Process -FilePath $new -ArgumentList @('eval','tests\load\winbench.tcl','backlog','30') -PassThru -NoNewWindow
            Start-Sleep 3; Write-Host "Tcl listener that is not accepting:"; python tests/load/accept_ref.py backlog 18080; $b | Stop-Process -Force
            $q = Start-Process python -ArgumentList @('tests/load/accept_ref.py','listen','18082','40') -PassThru -NoNewWindow
            Start-Sleep 2; Write-Host "Python listener that is not accepting:"; python tests/load/accept_ref.py backlog 18082; $q | Stop-Process -Force
            exit 0
          }
          if ($v -eq 'python') {
            $p = Start-Process python -ArgumentList @('tests/load/accept_ref.py','18080','24') -RedirectStandardOutput acc.txt -PassThru -NoNewWindow
          } else {
            $exe = if ($v.StartsWith('new')) { $new } elseif ($v.StartsWith('prev')) { $prev } else { $old }
            $env:ACCEPT_MODE = $v.Split('-')[1]
            $p = Start-Process -FilePath $exe -ArgumentList @('eval','tests\load\winbench.tcl','accept','24') -RedirectStandardOutput acc.txt -PassThru -NoNewWindow
          }
          Start-Sleep 4
          & $gen connflood -addr "127.0.0.1:18080" -workers 150 -dur 20s -srcbase 127.0.3.0 -srcn 500 2>&1 | Select-Object -Last 3
          $p | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          Get-Content acc.txt
  linux:
    strategy:
      fail-fast: false
      matrix:
        mode: [bare, state]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: cd tests/load/tgload && go build -o ../tgload-bin .
      - name: Reference on Linux (${{ matrix.mode }})
        run: |
          chmod +x releases/tclguard-linux-x86_64
          ACCEPT_PORT=18080 ACCEPT_MODE=${{ matrix.mode }} releases/tclguard-linux-x86_64 eval tests/load/winbench.tcl accept 24 > acc.txt &
          sleep 4
          tests/load/tgload-bin connflood -addr 127.0.0.1:18080 -workers 150 -dur 20s -srcbase 127.0.3.0 -srcn 500 2>&1 | tail -3
          wait; cat acc.txt
