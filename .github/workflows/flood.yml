name: flood

# The sustained flood test (tests/load) on real machines: Windows and macOS over loopback, Linux through two network namespaces
# with the kernel firewall on. Slow (10-15 minutes each), so it runs by hand and when the load test changes. Results are
# printed in the log and uploaded as JSON.
on:
  push:
    paths:
      - '.github/workflows/flood.yml'
      - 'tests/load/**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Build the load generators
        run: cd tests/load/tgload; go build -o ../tgload-bin.exe .
      - name: Flood test against the Windows starpack
        shell: pwsh
        run: |
          pip install psutil
          $env:TG_CMD = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          python -u tests/load/run_flood.py --tgload tests/load/tgload-bin.exe --soak 90 --label windows
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: flood-windows, path: tests/load/results/*.json }

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: The load generators
        run: |
          (cd tests/load/tgload && go build -o ../tgload-bin .)
          pip3 install --break-system-packages psutil 2>/dev/null || pip3 install psutil
      - name: Flood test against the macOS starpack
        run: |
          ulimit -n 10240 || true
          chmod +x releases/tclguard-macos-arm64; xattr -cr releases/tclguard-macos-arm64 || true
          export TG_CMD="$PWD/releases/tclguard-macos-arm64"
          python3 -u tests/load/run_flood.py --soak 90 --label macos
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: flood-macos, path: tests/load/results/*.json }

  linux-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Build, install nftables and the Tcl starpack's helpers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 python3-psutil
          (cd tests/load/tgload && go build -o ../tgload-bin .)
      - name: Flood test through network namespaces, three firewall settings
        run: |
          export TG_CMD="$PWD/releases/tclguard-linux-x86_64"
          for fw in none bans harden; do
            sudo -E tests/load/run_flood_netns.sh --fw $fw --syn --soak 90 --label netns-$fw
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: flood-linux, path: tests/load/results/*.json }
