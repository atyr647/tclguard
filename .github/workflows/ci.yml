name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ Linux ----
  linux:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl8.6 tk8.6 tcllib tcl-udp tcl-tls tcl-thread tcl-vfs xvfb nftables python3 imagemagick openssl
      - name: Lint
        if: ${{ !cancelled() }}
        run: python3 tools/lint_vars.py
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: cd tests && tclsh8.6 all.tcl
      - name: Unit test that needs root (files written by root are handed back to the folder's owner)
        if: ${{ !cancelled() }}
        run: cd tests && sudo -E tclsh8.6 handback.test | grep -E 'Total|FAILED'
      - name: Self-test (source)
        if: ${{ !cancelled() }}
        run: tclsh8.6 tclguard.vfs/main.tcl selftest
      - name: GUI smoke test (Xvfb)
        if: ${{ !cancelled() }}
        run: cd tests/gui && xvfb-run -a -s "-screen 0 1300x900x24" wish8.6 smoke.tcl
      - name: Integration tests (real sockets)
        if: ${{ !cancelled() }}
        run: cd tests/integration && python3 -u test_http.py && python3 -u test_features.py && python3 -u test_update.py && python3 -u test_reserve.py
      - name: HTTP parser fuzzer (deterministic smoke run with smuggling, liveness and CPU oracles)
        if: ${{ !cancelled() }}
        run: python3 -u tests/fuzz/fuzz.py ci
      - name: IPv6 end to end (listeners, backends, PROXY protocol, UDP, per-/64 bans)
        if: ${{ !cancelled() }}
        run: cd tests/integration && sudo -E env "PATH=$PATH" python3 -u test_ipv6.py
      - name: TLS termination tests (source, system OpenSSL)
        if: ${{ !cancelled() }}
        run: cd tests/integration && python3 -u test_tls.py
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version: stable
      - name: Build Pebble (Let's Encrypt's ACME test server)
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
          echo "PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_TESTDIR=$(ls -d $(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@*/test | head -1)" >> "$GITHUB_ENV"
      - name: Automatic certificates (ACME) against Pebble
        if: ${{ !cancelled() }}
        run: cd tests/integration && python3 -u test_acme.py
      - name: Real-kernel nftables tests
        if: ${{ !cancelled() }}
        run: sudo python3 tests/kernel/run_kernel_tests.py
      - name: Installer with real systemd (needs a starpack built from this source tree)
        if: ${{ !cancelled() }}
        run: |
          chmod +x releases/tclguard-linux-x86_64
          sudo -E ./releases/tclguard-linux-x86_64 eval tests/platform/linux_install_test.tcl
      - name: Released starpack
        if: ${{ !cancelled() }}
        run: |
          chmod +x releases/tclguard-linux-x86_64
          ( cd releases && sha256sum -c SHA256SUMS --ignore-missing )
          ./releases/tclguard-linux-x86_64 version
          ./releases/tclguard-linux-x86_64 selftest
      - name: Released starpack - TLS and ACME (its own OpenSSL)
        if: ${{ !cancelled() }}
        run: |
          export TG_CMD="$PWD/releases/tclguard-linux-x86_64"
          cd tests/integration && python3 -u test_tls.py && python3 -u test_acme.py
      - name: Released starpack - a real starpack updates ITSELF (signed manifest, local HTTPS, rollback)
        if: ${{ !cancelled() }}
        run: cd tests/integration && python3 -u test_update_starpack.py
      - name: Released starpack - survives more connections than select() can watch (FD_SETSIZE)
        if: ${{ !cancelled() }}
        run: cd tests/integration && TG_CMD="$PWD/../../releases/tclguard-linux-x86_64" python3 -u test_fdlimit.py

  # ---------------------------------------------------------------- Windows ----
  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Facts about this runner
        run: |
          [System.Environment]::OSVersion.VersionString
          "admin: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          python --version
      - name: Verify release checksums
        run: |
          foreach ($line in Get-Content releases\SHA256SUMS) {
            $hash, $name = $line -split '\s+', 2
            if ($name -like '*linux*') { continue }
            $actual = (Get-FileHash ("releases\" + $name.Trim()) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "checksum mismatch for $name" } else { "ok  $name" }
          }
      - name: Starpack - version and self-test (console build)
        timeout-minutes: 6
        run: |
          .\releases\tclguard-windows-x86_64-console.exe version
          .\releases\tclguard-windows-x86_64-console.exe selftest
      - name: Starpack - unit tests with the Tcl that ships inside it
        timeout-minutes: 10
        run: |
          $exe = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          $failed = 0
          foreach ($t in 'ip','config','bans','firewall','monitor','autostart','crypto','https','install','update') {
            Write-Host "=== $t.test"
            $out = pwsh -NoProfile -File tools\ci-bounded.ps1 -Exe $exe -Seconds 120 eval "tests\$t.test" 2>&1 | Out-String
            $code = $LASTEXITCODE
            ($out -split "`n" | Select-String 'Total|FAILED' | Select-Object -First 40) | ForEach-Object { $_.Line }
            if ($code -ne 0) {
              $failed++; Write-Host "!! $t.test exit code $code; last lines of its output:"
              ($out -split "`n" | Select-Object -Last 40) | ForEach-Object { $_.TrimEnd() }
            }
          }
          if ($failed) { throw "$failed unit test file(s) failed" }
      - name: Windows platform tests (real netsh, Task Scheduler, netstat)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          $exe = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          $failed = @()
          foreach ($phase in 'facts','netstat','autostart','locations','firewall','firewallscale','elevation') {
            Write-Host "##[group]platform phase: $phase"
            pwsh -NoProfile -File tools\ci-bounded.ps1 -Exe $exe -Seconds 180 eval tests\platform\windows_test.tcl $phase
            if ($LASTEXITCODE -ne 0) { $failed += "$phase (exit $LASTEXITCODE)" }
            Write-Host "##[endgroup]"
          }
          if ($failed) { throw "platform phases failed: $($failed -join ', ')" }
      - name: Probe - what does Windows allow on a RUNNING starpack's file?
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: powershell -NoProfile -File tests/platform/windows_lock_probe.ps1 "$PWD\releases\tclguard-windows-x86_64-console.exe"
      - name: Windows installer tests (shortcuts, Add/Remove Programs, Scheduled Task, running .exe, self-delete)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $exe = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          $failed = @()
          foreach ($phase in 'user','system','defer','update') {
            Write-Host "##[group]installer phase: $phase"
            pwsh -NoProfile -File tools\ci-bounded.ps1 -Exe $exe -Seconds 240 eval tests\platform\windows_install_test.tcl $phase
            if ($LASTEXITCODE -ne 0) { $failed += "$phase (exit $LASTEXITCODE)" }
            Write-Host "##[endgroup]"
          }
          if ($failed) { throw "installer phases failed: $($failed -join ', ')" }
      - name: Integration tests against the starpack (real sockets)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          $env:TG_CMD = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          Push-Location tests\integration
          python -u test_http.py
          python -u test_features.py
          Pop-Location
      - name: IPv6 end to end (starpack, real Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          $env:TG_CMD = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          Push-Location tests\integration
          python -u test_ipv6.py
          if ($LASTEXITCODE -ne 0) { throw "IPv6 tests failed" }
          Pop-Location
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version: stable
      - name: TLS termination and automatic certificates (starpack, real Windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"      # openssl.exe for the test helpers
          $env:TG_CMD = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
          $env:PEBBLE = (Join-Path (go env GOPATH) 'bin\pebble.exe')
          $env:PEBBLE_TESTDIR = (Get-ChildItem (Join-Path (go env GOMODCACHE) 'github.com\letsencrypt\pebble') -Directory -Filter 'v2@*' | Select-Object -First 1).FullName + '\test'
          Push-Location tests\integration
          python -u test_tls.py
          if ($LASTEXITCODE -ne 0) { throw "TLS tests failed" }
          python -u test_acme.py
          if ($LASTEXITCODE -ne 0) { throw "ACME tests failed" }
          Pop-Location
      - name: A real Windows starpack updates ITSELF (rename-over-running exe, signed manifest, rollback)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"      # openssl.exe
          $env:TG_STARPACK = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          Push-Location tests\integration
          python -u test_update_starpack.py
          if ($LASTEXITCODE -ne 0) { throw "starpack self-update test failed" }
          Pop-Location
      - name: GUI smoke test inside the starpack
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: .\releases\tclguard-windows-x86_64-console.exe eval tests\gui\smoke.tcl
      - name: GUI screenshot (real Windows desktop)
        continue-on-error: true
        run: |
          $env:TCLGUARD_HOME = "$env:RUNNER_TEMP\tgshot"
          New-Item -ItemType Directory -Force $env:TCLGUARD_HOME | Out-Null
          $p = Start-Process -FilePath .\releases\tclguard-windows-x86_64.exe -ArgumentList '--gui','--no-firewall' -PassThru
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\windows-gui.png")
          "GUI process responding: " + (-not $p.HasExited)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui
          path: ${{ runner.temp }}/windows-gui.png
          if-no-files-found: ignore

  # ------------------------------------------------------------------ macOS ----
  macos:
    timeout-minutes: 40
    runs-on: macos-latest
    env:
      TCLSH: /opt/homebrew/opt/tcl-tk@8/bin/tclsh8.6
      WISH: /opt/homebrew/opt/tcl-tk@8/bin/wish8.6
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl/Tk 8.6 (the system one is 8.5)
        run: |
          brew install tcl-tk@8
          $TCLSH <<< 'puts [info patchlevel]'
      - name: Build the udp extension (tcludp)
        continue-on-error: true
        run: |
          curl -fsSL -o tcludp.tgz "https://downloads.sourceforge.net/project/tcludp/tcludp/1.0.11/tcludp-1.0.11.tar.gz"
          dir=$(tar tzf tcludp.tgz | head -1 | cut -d/ -f1)
          tar xzf tcludp.tgz && cd "$dir" && pwd && ls
          ./configure --with-tcl=/opt/homebrew/opt/tcl-tk@8/lib --prefix=$HOME/tclpkgs
          make -j4 && make install
          find $HOME/tclpkgs -name 'pkgIndex.tcl' | head -3
          echo "TCLLIBPATH=$(dirname $(find $HOME/tclpkgs -name pkgIndex.tcl | head -1))/.." >> "$GITHUB_ENV"
      - name: Build the tls extension (tcltls 2.0.1; 1.7.22 crashes in tls::import on macOS) against OpenSSL 3
        run: |
          brew install openssl@3
          curl -fsSL -o tcltls.zip "https://core.tcl-lang.org/tcltls/zip/tcltls.zip?uuid=tls-2.0.1"
          echo "abfd8b765176abf7baf014fdbfea85985adcb7c013933fa29262df1187dceee9  tcltls.zip" | shasum -a 256 -c -
          unzip -q tcltls.zip && cd tcltls
          ./configure --with-tcl=/opt/homebrew/opt/tcl-tk@8/lib --with-openssl-dir=$(brew --prefix openssl@3) --prefix=$HOME/tclpkgs
          make -j4 && make install
          echo "TCLLIBPATH=$TCLLIBPATH $(dirname $(find $HOME/tclpkgs -path '*tcltls*' -name pkgIndex.tcl | head -1))/.." >> "$GITHUB_ENV"
      - name: Which optional packages are present
        run: |
          # (never load Tk inside tclsh here: on macOS that can block waiting for a window server)
          # tclsh reading a script from stdin exits 0 even when it errors, so test explicitly
          if $TCLSH <<< 'if {[catch {package require udp} v]} { puts "udp: MISSING ($v)"; exit 1 } else { puts "udp: $v" }'; then
            echo "HAVE_UDP=1" >> "$GITHUB_ENV"
          else
            echo "TG_NO_UDP=1" >> "$GITHUB_ENV"
          fi
          $TCLSH <<< 'puts "Thread: [package require Thread]"'
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: cd tests && for t in ip config bans firewall monitor autostart crypto https install update; do $TCLSH $t.test; done 2>&1 | grep -E "Total|FAILED"
      - name: Self-test (source)
        if: ${{ !cancelled() }}
        run: $TCLSH tclguard.vfs/main.tcl selftest
      - name: macOS platform tests (real pfctl, LaunchAgent, netstat)
        if: ${{ !cancelled() }}
        run: sudo -E $TCLSH tests/platform/macos_test.tcl
      - name: macOS elevation (the AppleScript, the root path and the cancel wording)
        if: ${{ !cancelled() }}
        run: $TCLSH tests/platform/macos_elevation_test.tcl
      - name: macOS installer tests (plist lint, launchctl, stand-in program; no starpack exists)
        if: ${{ !cancelled() }}
        run: sudo -E $TCLSH tests/platform/macos_install_test.tcl
      - name: Signed-update integration test (local HTTPS server)
        if: ${{ !cancelled() }}
        run: cd tests/integration && TCLSH=$TCLSH python3 -u test_update.py
      - name: Integration tests (real sockets)
        if: ${{ !cancelled() }}
        run: |
          export TG_CMD="$TCLSH $PWD/tclguard.vfs/main.tcl"
          cd tests/integration && python3 -u test_http.py && python3 -u test_features.py
      - name: IPv6 end to end
        if: ${{ !cancelled() }}
        run: |
          export TG_CMD="$TCLSH $PWD/tclguard.vfs/main.tcl"
          cd tests/integration && python3 -u test_ipv6.py
      - name: TLS termination tests
        if: ${{ !cancelled() }}
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          $TCLSH <<< 'puts "tls: [package require tls] [tls::version]"'
          export TG_CMD="$TCLSH $PWD/tclguard.vfs/main.tcl"
          cd tests/integration && python3 -u test_tls.py
      - uses: actions/setup-go@v5
        if: ${{ !cancelled() }}
        with:
          go-version: stable
      - name: Automatic certificates (ACME) against Pebble
        if: ${{ !cancelled() }}
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
          export PEBBLE="$(go env GOPATH)/bin/pebble"
          export PEBBLE_TESTDIR="$(ls -d $(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@*/test | head -1)"
          export TG_CMD="$TCLSH $PWD/tclguard.vfs/main.tcl"
          cd tests/integration && python3 -u test_acme.py
      - name: Released starpack (arm64, built on a Mac runner) - version and self-test
        if: ${{ !cancelled() }}
        run: |
          chmod +x releases/tclguard-macos-arm64
          xattr -cr releases/tclguard-macos-arm64 || true     # (what a person does with a download: remove the quarantine flag)
          releases/tclguard-macos-arm64 version
          releases/tclguard-macos-arm64 selftest
      - name: Released starpack - the installer installs the single file, and the installed copy removes itself
        if: ${{ !cancelled() }}
        run: releases/tclguard-macos-arm64 eval tests/platform/macos_install_starpack_test.tcl
      - name: Released starpack - integration, TLS (its own tcltls 2.0.1 + OpenSSL), updates, descriptors
        if: ${{ !cancelled() }}
        run: |
          export TG_CMD="$PWD/releases/tclguard-macos-arm64"
          cd tests/integration
          python3 -u test_http.py && python3 -u test_features.py && python3 -u test_tls.py && python3 -u test_ipv6.py
          python3 -u test_fdlimit.py && python3 -u test_reserve.py
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 -u test_update_starpack.py
      - name: Released starpack - GUI smoke test under Aqua
        if: ${{ !cancelled() }}
        run: releases/tclguard-macos-arm64 eval tests/gui/smoke.tcl
      - name: Released starpack - the GUI as root (this is what "Restart as administrator" produces on macOS)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: sudo -E releases/tclguard-macos-arm64 eval tests/gui/smoke.tcl
      - name: GUI smoke test (Aqua)
        continue-on-error: true
        timeout-minutes: 5
        run: $WISH tests/gui/smoke.tcl
      - name: GUI screenshot
        continue-on-error: true
        timeout-minutes: 3
        run: |
          export TCLGUARD_HOME="$RUNNER_TEMP/tgshot"; mkdir -p "$TCLGUARD_HOME"
          $WISH tclguard.vfs/main.tcl --gui --no-firewall &
          sleep 10
          screencapture -x "$RUNNER_TEMP/macos-gui.png"
          kill %1 || true
      - name: TLS probe (where does setup stop?)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          $TCLSH tests/platform/tls_probe.tcl
          echo "probe exit status: $?"
          find "$HOME/tclpkgs" -name '*.dylib' -print
          for f in $(find "$HOME/tclpkgs" -name '*.dylib'); do otool -L "$f"; done
          echo "---- the same probe under lldb (backtrace of a crash)"
          lldb -b -o run -o "register read pc lr sp" -o 'image lookup -a $lr' -o 'image lookup -a $pc' -o "bt 30" -- $TCLSH tests/platform/tls_probe.tcl 2>&1 | tail -40 || true
          echo "---- one variant per process"
          for v in socket-server socket-client import-bare import-server-blocking import-cmd; do
            $TCLSH tests/platform/tls_variants.tcl $v 2>&1 | tail -4; echo "  -> exit status ${PIPESTATUS[0]}"
          done
          echo "---- which Tcl does tclsh link, and is anything else providing tls?"
          otool -L $TCLSH | head; $TCLSH <<< 'puts [info library]; puts $auto_path; puts [package ifneeded tls 1.7.22]' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-gui
          path: ${{ runner.temp }}/macos-gui.png
          if-no-files-found: ignore

  # The Intel Mac program (built on an Intel runner, see runtime-macos.yml) was only ever started, never put through the suites.
  macos-intel:
    timeout-minutes: 40
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Released starpack (x86_64, built on an Intel Mac runner) - version and self-test
        run: |
          uname -m
          chmod +x releases/tclguard-macos-x86_64
          xattr -cr releases/tclguard-macos-x86_64 || true
          releases/tclguard-macos-x86_64 version
          releases/tclguard-macos-x86_64 selftest
      - name: Released starpack - the installer installs the single file, and the installed copy removes itself
        if: ${{ !cancelled() }}
        run: releases/tclguard-macos-x86_64 eval tests/platform/macos_install_starpack_test.tcl
      - name: Released starpack - integration, TLS, updates, descriptors
        if: ${{ !cancelled() }}
        run: |
          brew install openssl@3 || true
          export TG_CMD="$PWD/releases/tclguard-macos-x86_64"
          cd tests/integration
          python3 -u test_http.py && python3 -u test_features.py && python3 -u test_tls.py && python3 -u test_ipv6.py
          python3 -u test_fdlimit.py && python3 -u test_reserve.py
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 -u test_update_starpack.py
      - name: Released starpack - GUI smoke test under Aqua
        if: ${{ !cancelled() }}
        run: releases/tclguard-macos-x86_64 eval tests/gui/smoke.tcl
