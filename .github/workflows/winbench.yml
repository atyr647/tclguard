name: winbench

# Measures Tcl's own event loop on each OS (tests/load/winbench.tcl), to find where a platform's speed limit is.
on:
  push:
    paths:
      - '.github/workflows/winbench.yml'
      - 'tests/load/winbench.tcl'
      - 'tests/load/pingpong.py'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: What the OS itself can do (Python, blocking sockets)
        run: python tests/load/pingpong.py 4
      - name: Tcl event loop, section by section (each bounded)
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\releases\tclguard-windows-x86_64-console.exe).Path
          foreach ($s in 'timers','idle','pingpong','blocking','threads') {
            Write-Host "=== $s"
            pwsh -NoProfile -File tools\ci-bounded.ps1 -Exe $exe -Seconds 60 eval tests\load\winbench.tcl $s 4
          }
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x releases/tclguard-macos-arm64
          for s in timers idle pingpong blocking threads; do releases/tclguard-macos-arm64 eval tests/load/winbench.tcl $s 4 || true; done
          python3 tests/load/pingpong.py 4
