name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          [System.Environment]::OSVersion.VersionString
          "admin: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          python --version
          Get-Command netsh, schtasks, powershell, tclsh*, wish* -ErrorAction SilentlyContinue | Format-Table Name,Source
          netsh advfirewall show currentprofile | Select-Object -First 4
          Get-ChildItem releases | Format-Table Name,Length
          Get-FileHash releases\tclguard-windows-x86_64-console.exe -Algorithm SHA256
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sw_vers; uname -m; id -u; sudo -n true && echo "sudo ok"
          python3 --version; which tclsh tclsh8.6 wish pfctl netstat brew
          sudo pfctl -s info 2>&1 | head -3
          brew list --versions tcl-tk 2>&1 | head -2
          netstat -an -p tcp | head -6
