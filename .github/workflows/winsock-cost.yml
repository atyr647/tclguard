name: winsock-cost

# The raw Winsock cost without Tcl (tests/load/winsock_cost.c): is WSAAsyncSelect itself what limits connection handling on Windows?
on:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        run: ['select', 'accept 0', 'accept 1']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.run }}
        shell: pwsh
        run: |
          gcc -O2 -o winsock_cost.exe tests/load/winsock_cost.c -lws2_32
          ./winsock_cost.exe ${{ matrix.run }}
