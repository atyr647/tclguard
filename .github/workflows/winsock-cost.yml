name: winsock-cost

# The raw Winsock accept cost without Tcl (tests/load/winsock_cost.c), under the same external flood (tgload connflood) as the Tcl and Python runs:
# does a blocking accept() loop behave differently from one that uses WSAAsyncSelect(FD_ACCEPT) the way Tcl does?
on:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        run: ['3', '5', '6']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Build
        run: |
          cd tests/load/tgload; go build -o ../tgload-bin.exe .
          cd ../../..; gcc -O2 -o winsock_cost.exe tests/load/winsock_cost.c -lws2_32
      - name: accept mode ${{ matrix.run }}
        shell: pwsh
        run: |
          $gen = (Resolve-Path .\tests\load\tgload-bin.exe).Path
          $p = Start-Process -FilePath .\winsock_cost.exe -ArgumentList @('accept','${{ matrix.run }}','ext') -RedirectStandardOutput out.txt -PassThru -NoNewWindow
          Start-Sleep 3
          & $gen connflood -addr "127.0.0.1:19090" -workers 150 -dur 20s -srcbase 127.0.3.0 -srcn 500 2>&1 | Select-Object -Last 2
          $p | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force }
          Get-Content out.txt
